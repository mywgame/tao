<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="tao_boost">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>TAO BOOST</title>
  <link rel="manifest" href="manifest.json">

  <style>
    input:-webkit-autofill,
    input:-webkit-autofill:hover, 
    input:-webkit-autofill:focus, 
    input:-webkit-autofill:active {
      transition: background-color 600000s ease-in-out 0s, color 600000s ease-in-out 0s !important;
      -webkit-box-shadow: 0 0 0px 1000px #131C2E inset !important; 
      -webkit-text-fill-color: #00E5FF !important; 
    }
  </style>
</head>
<body>

  <script>
    window.addEventListener('load', function() {
      if (window._flutter && window._flutter.loader) {
        window._flutter.loader.didCreateEngineInitializer = async function(engineInitializer) {
          // ⚡ CanvasKit रेंडरर जो स्मूथनेस भी देगा और वेब एलिमेंट्स को कस्टमाइज़ रखेगा
          const appRunner = await engineInitializer.initializeEngine({
            renderer: "canvaskit" 
          });
          await appRunner.runApp();
        };
      }
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
