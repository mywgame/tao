name: tao_boost
description: TAO Boost - Bittensor Intelligence Staking Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # SVG Support (Logo ke liye zaroori)
  flutter_svg: ^2.0.10

  # Navigation
  go_router: ^14.2.0

  # UI & Animations
  carousel_slider: ^5.0.0
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  confetti: ^0.7.0
  cached_network_image: ^3.4.1
  lottie: ^3.1.2

  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4

  # Networking & Storage
  dio: ^5.9.2
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^10.2.0

  # Utils
  intl: ^0.19.0
  google_fonts: ^6.2.1
  get_it: ^9.2.1
  flutter_riverpod: ^3.3.1

  # Firebase (agar use kar rahe ho toh)
  firebase_core: ^4.9.0
  firebase_auth: ^6.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/