name: tao_boost
description: TAO Boost - Bittensor Intelligence Staking Platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_bloc: ^8.1.6
  bloc: ^8.1.4
  
  # Navigation
  go_router: ^14.2.0
  
  # Networking
  dio: ^5.9.2
  
  # Local Storage
  shared_preferences: ^2.3.0
  flutter_secure_storage: ^10.2.0
  
  # UI & Animations
  fl_chart: ^0.68.0
  shimmer: ^3.0.0
  confetti: ^0.7.0
  cached_network_image: ^3.4.1
  lottie: ^3.1.2
  
  # Utils
  intl: ^0.19.0
  google_fonts: ^6.2.1
  get_it: ^9.2.1
  flutter_riverpod: ^3.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/